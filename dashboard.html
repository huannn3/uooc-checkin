<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Uooc · 签到中心</title>
<style>
:root{font-family:Inter,"Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;color:#17211e;background:#f4f6f3;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.shell{max-width:1180px;margin:auto;padding:34px 28px 60px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}.brand{display:flex;align-items:center;gap:12px;font-weight:750;font-size:17px}.logo{width:38px;height:38px;border-radius:13px;background:#176b52;color:white;display:grid;place-items:center;font-size:20px}.top-right{display:flex;align-items:center;gap:10px;color:#64716b;font-size:13px}.live{width:8px;height:8px;background:#33a477;border-radius:50%;box-shadow:0 0 0 4px #dff2e9}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:26px}.eyebrow{color:#55736a;font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.hero h1{margin:8px 0 7px;font-size:34px;letter-spacing:-.04em}.sub{margin:0;color:#69756f;font-size:14px}.actions{display:flex;gap:10px}.btn{height:44px;padding:0 17px;border-radius:12px;border:1px solid #dce4df;background:white;color:#30423a;font-weight:650;cursor:pointer}.btn:hover{background:#f8fbf9}.primary{background:#176b52;color:white;border-color:#176b52;box-shadow:0 5px 12px #176b5226}.primary:hover{background:#125a45}.primary:disabled{opacity:.62;cursor:wait}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.stat,.panel{background:#fff;border:1px solid #e5ebe7;border-radius:16px;box-shadow:0 2px 7px #163c2810}.stat{padding:17px 19px}.stat-label{font-size:12px;color:#738078}.stat-value{font-size:27px;font-weight:750;margin-top:6px;letter-spacing:-.03em}.stat-value small{font-size:13px;color:#87938c;font-weight:500;letter-spacing:0}.panel{overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:19px 22px;border-bottom:1px solid #edf0ee}.panel-title{font-weight:720}.panel-caption{font-size:12px;color:#87918c;margin-top:4px}.course{display:grid;grid-template-columns:minmax(220px,1fr) 130px 120px 110px;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid #f0f3f1}.course:last-child{border-bottom:0}.course:hover{background:#fbfcfb}.course-name{font-weight:640;font-size:14px}.course-id{font:11px ui-monospace,monospace;color:#9aa49e;margin-top:5px}.progress{font-size:13px;color:#526159}.bar{height:5px;background:#edf1ee;border-radius:9px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;background:#42a779;border-radius:9px}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:650;white-space:nowrap}.badge:before{content:"";width:6px;height:6px;border-radius:100%;background:currentColor}.ok{color:#20845e;background:#e8f5ee}.wait{color:#94702a;background:#faf2de}.bad{color:#bd5349;background:#fbedeb}.muted{color:#65736b;background:#eef1ef}.last{font-size:12px;color:#929c96;text-align:right}.notice{margin-top:18px;padding:13px 16px;border:1px solid #e8e1ca;background:#fffaf0;border-radius:12px;color:#786643;font-size:12px;line-height:1.7}.activity{margin-top:22px}.activity pre{max-height:230px;overflow:auto;margin:0;padding:16px 20px;background:#182521;color:#d3e2d9;font:12px/1.8 ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap}.empty{padding:32px;text-align:center;color:#7b8780}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1c2d26;color:white;border-radius:12px;padding:12px 18px;font-size:13px;box-shadow:0 8px 30px #0002;display:none}.foot{margin-top:20px;color:#9aa49e;font-size:11px;text-align:center}@media(max-width:700px){.shell{padding:20px 14px}.hero{align-items:flex-start;flex-direction:column}.hero h1{font-size:28px}.actions{width:100%}.actions .btn{flex:1}.stats{grid-template-columns:repeat(2,1fr);gap:9px}.course{grid-template-columns:1fr auto;gap:8px 12px;padding:14px}.course .progress{grid-column:1}.last{display:none}.panel-head{padding:16px}.top-right .clock{display:none}}
</style></head><body><main class="shell"><header class="top"><div class="brand"><div class="logo">✓</div><span>Uooc 签到助手</span></div><div class="top-right"><i class="live"></i><span>仅本机运行</span><span class="clock" id="clock"></span></div></header>
<section class="hero"><div><div class="eyebrow">COURSE CHECK-IN</div><h1>签到中心</h1><p class="sub">查看课程签到状态，需要时手动检查全部课程。</p></div><div class="actions"><button class="btn" id="refresh">↻　刷新状态</button><button class="btn primary" id="run">✓　签到全部课程</button></div></section>
<section class="stats"><div class="stat"><div class="stat-label">课程总数</div><div class="stat-value" id="total">—</div></div><div class="stat"><div class="stat-label">已确认今日签到</div><div class="stat-value" id="signed">—</div></div><div class="stat"><div class="stat-label">待检查</div><div class="stat-value" id="pending">—</div></div><div class="stat"><div class="stat-label">需留意</div><div class="stat-value" id="failed">—</div></div></section>
<section class="panel"><div class="panel-head"><div><div class="panel-title">我的课程</div><div class="panel-caption" id="updated">正在读取本机课程记录…</div></div><span class="badge muted" id="runStatus">就绪</span></div><div id="courses"></div></section>
<div class="notice">点击“签到全部课程”会实际启动项目原有签到流程：逐门打开课程并读取网站状态；已签到课程会跳过重复签到。打开此面板本身不会自动签到。签到结果以网站实际返回为准。</div>
<section class="panel activity"><div class="panel-head"><div><div class="panel-title">运行记录</div><div class="panel-caption">最近一次手动操作的实时输出</div></div></div><pre id="output">等待操作。</pre></section><div class="foot">登录状态仅保存在项目本机文件中；本页面不读取或展示 Cookie、令牌或认证快照。</div></main><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);let busy=false;
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function badge(s){return ({already:['今日已签到','ok'],signed:['今日签到成功','ok'],complete:['次数已满','ok'],failed:['未确认','bad'],pending:['待检查','wait']})[s]||['待检查','wait']}
function render(d){$('total').textContent=d.summary.total;$('signed').textContent=d.summary.signed;$('pending').textContent=d.summary.pending;$('failed').textContent=d.summary.failed;$('updated').textContent=`${d.courses.length} 门课程 · ${d.run.running?'签到任务运行中':d.run.finishedAt?'最近完成 '+new Date(d.run.finishedAt).toLocaleString():'状态来自最近一次运行'}`;$('runStatus').textContent=d.run.running?'运行中':d.run.exitCode===0?'已完成':d.run.exitCode!==null?'有未确认项目':'就绪';$('runStatus').className='badge '+(d.run.running?'wait':d.run.exitCode===0?'ok':d.run.exitCode!==null?'bad':'muted');$('run').disabled=d.run.running;busy=d.run.running;
$('courses').innerHTML=d.courses.length?d.courses.map(c=>{const [label,cls]=badge(c.status),ratio=c.total?Math.min(100,Math.round(c.count/c.total*100)):0;return `<article class="course"><div><div class="course-name">${esc(c.name)}</div><div class="course-id">课程编号 ${esc(c.id)}</div></div><div class="progress">${c.count===null?'次数暂无':`${esc(c.count)} / ${esc(c.total)}`}<div class="bar"><i style="width:${ratio}%"></i></div></div><div><span class="badge ${cls}" title="${esc(c.error)}">${label}</span></div><div class="last">${c.checkedAt?esc(new Date(c.checkedAt).toLocaleDateString()):'尚无记录'}</div></article>`}).join(''):'<div class="empty">尚未配置课程。先运行 node uooc.js setup 添加课程。</div>';
if(d.run.output?.length)$('output').textContent=d.run.output.join('\n');}
async function refresh(){try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error();render(await r.json())}catch{$('updated').textContent='无法读取本机服务状态'}}
$('refresh').onclick=refresh;$('run').onclick=async()=>{if(!confirm('现在对配置中的全部课程执行一次实际签到检查吗？已签到课程不会重复签到。'))return;try{const r=await fetch('/api/run',{method:'POST'}),d=await r.json();if(!r.ok)throw Error(d.error||'启动失败');$('output').textContent='签到流程已启动…';toast('签到已启动，正在读取课程状态');await refresh()}catch(e){toast(e.message)}};
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}
function tick(){const d=new Date();$('clock').textContent=d.toLocaleString('zh-CN',{weekday:'short',hour:'2-digit',minute:'2-digit'})}tick();setInterval(tick,30000);refresh();setInterval(refresh,2500);
</script></body></html>
